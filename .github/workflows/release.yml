name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach assets to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run vet and race tests
        run: |
          go vet ./...
          go test -race ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: freebsd
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: freebsd
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: openbsd
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: openbsd
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: netbsd
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: netbsd
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip

    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release tag and version
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          ARCHIVE_NAME="gymbag_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build binary and package archive
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p staging dist
          BIN_NAME="gymbag${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X gymbag/internal/cli.Version=${{ steps.meta.outputs.version }}" -o "staging/${BIN_NAME}" ./cmd/gymbag
          cp LICENSE README.md Gymbagfile staging/

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd staging && zip -q -r "../dist/${{ steps.meta.outputs.archive_name }}" .)
          else
            tar -C staging -czf "dist/${{ steps.meta.outputs.archive_name }}" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ steps.meta.outputs.archive_name }}
          if-no-files-found: error

  package-arch:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch: x86_64
          - goarch: arm64
            arch: aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}

      - name: Download Linux binary archive
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-${{ matrix.goarch }}
          path: input

      - name: Build Arch Linux .pkg.tar.zst package
        id: pkg
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          PKGVER="${VERSION//-/.}"
          ARCHIVE="input/gymbag_${VERSION}_linux_${{ matrix.goarch }}.tar.gz"

          mkdir -p pkgbuild dist-arch
          tar -xzf "${ARCHIVE}" -C pkgbuild
          cp packaging/arch/gymbag.service packaging/arch/gymbag.install pkgbuild/

          cat > pkgbuild/PKGBUILD <<EOF
          pkgname=gymbag
          pkgver=${PKGVER}
          pkgrel=1
          pkgdesc="Single-binary HTTPS reverse proxy & Proof-of-Work WAF in pure Go"
          arch=('${{ matrix.arch }}')
          url="https://github.com/Evil-Project/gymbag"
          license=('Apache-2.0')
          depends=('libcap')
          backup=('etc/gymbag/Gymbagfile')
          options=('!strip' '!debug')
          install=gymbag.install
          source=('gymbag' 'Gymbagfile' 'LICENSE' 'README.md' 'gymbag.service')
          sha256sums=('SKIP' 'SKIP' 'SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "\$srcdir/gymbag" "\$pkgdir/usr/bin/gymbag"
              install -Dm644 "\$srcdir/Gymbagfile" "\$pkgdir/etc/gymbag/Gymbagfile"
              install -Dm644 "\$srcdir/gymbag.service" "\$pkgdir/usr/lib/systemd/system/gymbag.service"
              install -Dm644 "\$srcdir/LICENSE" "\$pkgdir/usr/share/licenses/\$pkgname/LICENSE"
              install -Dm644 "\$srcdir/README.md" "\$pkgdir/usr/share/doc/\$pkgname/README.md"
          }
          EOF

          docker run --rm \
            -v "${PWD}/pkgbuild:/work" \
            -v "${PWD}/dist-arch:/out" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              useradd -m builder
              cp -r /work /home/builder/pkg
              chown -R builder:builder /home/builder/pkg
              CONF=/etc/makepkg.conf
              if [[ "${{ matrix.arch }}" != "x86_64" ]]; then
                cp /etc/makepkg.conf /tmp/makepkg-target.conf
                sed -i "s/^CARCH=.*/CARCH=\"${{ matrix.arch }}\"/; s/^CHOST=.*/CHOST=\"${{ matrix.arch }}-unknown-linux-gnu\"/" /tmp/makepkg-target.conf
                CONF=/tmp/makepkg-target.conf
              fi
              su builder -c "cd /home/builder/pkg && MAKEPKG_CONF=${CONF} PKGEXT=.pkg.tar.zst makepkg -f -A --nodeps --noconfirm"
              cp /home/builder/pkg/*.pkg.tar.zst /out/
              chmod 644 /out/*.pkg.tar.zst
            '
          ls -lh dist-arch/

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-arch-${{ matrix.arch }}
          path: dist-arch/*.pkg.tar.zst
          if-no-files-found: error

  package-debian:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}

      - name: Download Linux binary archive
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-${{ matrix.goarch }}
          path: input

      - name: Build Debian .deb package
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          DEB_VERSION="${VERSION//-/\~}"
          ARCHIVE="input/gymbag_${VERSION}_linux_${{ matrix.goarch }}.tar.gz"

          mkdir -p staging debroot/DEBIAN \
            debroot/usr/bin \
            debroot/etc/gymbag \
            debroot/lib/systemd/system \
            debroot/usr/share/doc/gymbag \
            dist-deb

          tar -xzf "${ARCHIVE}" -C staging

          install -m 0755 staging/gymbag debroot/usr/bin/gymbag
          install -m 0644 staging/Gymbagfile debroot/etc/gymbag/Gymbagfile
          install -m 0644 packaging/debian/gymbag.service debroot/lib/systemd/system/gymbag.service
          install -m 0644 staging/README.md debroot/usr/share/doc/gymbag/README.md
          install -m 0644 staging/LICENSE debroot/usr/share/doc/gymbag/copyright

          INSTALLED_SIZE="$(du -sk debroot | cut -f1)"
          cat > debroot/DEBIAN/control <<EOF
          Package: gymbag
          Version: ${DEB_VERSION}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.goarch }}
          Maintainer: Evil-Project <noreply@evilneuro.org>
          Installed-Size: ${INSTALLED_SIZE}
          Recommends: libcap2-bin
          Homepage: https://github.com/Evil-Project/gymbag
          Description: Single-binary HTTPS reverse proxy and Proof-of-Work WAF
           Gymbag is a pure-Go HTTPS reverse proxy and Proof-of-Work Web Application
           Firewall with automatic ACME/local TLS, native nginx/Apache/Caddyfile v2
           configuration support, and hot-reloadable firewall rules.
          EOF

          cat > debroot/DEBIAN/conffiles <<EOF
          /etc/gymbag/Gymbagfile
          EOF

          install -m 0755 packaging/debian/postinst debroot/DEBIAN/postinst
          install -m 0755 packaging/debian/prerm debroot/DEBIAN/prerm
          install -m 0755 packaging/debian/postrm debroot/DEBIAN/postrm

          DEB_NAME="gymbag_${VERSION}_linux_${{ matrix.goarch }}.deb"
          dpkg-deb --build --root-owner-group debroot "dist-deb/${DEB_NAME}"
          dpkg-deb --info "dist-deb/${DEB_NAME}"
          dpkg-deb --contents "dist-deb/${DEB_NAME}"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-deb-${{ matrix.goarch }}
          path: dist-deb/*.deb
          if-no-files-found: error

  package-nix:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build and verify NixOS flake package
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"

          nix eval .#nixosModules.default --apply 'm: builtins.isFunction m'
          nix build .#packages.x86_64-linux.default --print-out-paths
          ./result/bin/gymbag version
          ./result/bin/gymbag --help >/dev/null

          mkdir -p staging-nix/bin staging-nix/nix dist-nix
          install -m 0755 ./result/bin/gymbag staging-nix/bin/gymbag
          cp flake.nix LICENSE README.md staging-nix/
          if [[ -f flake.lock ]]; then
            cp flake.lock staging-nix/
          fi
          cp nix/module.nix staging-nix/nix/

          tar -C staging-nix -czf "dist-nix/gymbag_${VERSION}_nixos_x86_64-linux.tar.gz" .
          nix-store --export $(nix-store -qR ./result) | zstd -T0 -q -o "dist-nix/gymbag_${VERSION}_nixos_x86_64-linux.nar.zst"
          ls -lh dist-nix/

      - name: Upload NixOS package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-nix-x86_64-linux
          path: dist-nix/*
          if-no-files-found: error

  release:
    needs: [build, package-arch, package-debian, package-nix]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || (github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref) }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          LC_ALL=C sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          PRERELEASE_ARGS=()
          if [[ "${TAG#v}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
