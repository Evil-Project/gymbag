[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "gymbag"
version = "0.1.0"
description = "HTTPS reverse proxy with a proof-of-work web application firewall"
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "XiaoYuan151", email = "contact@xiaoyuan151.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=50.0.2",
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gymbag = "gymbag.__main__:main"

[tool.hatch.build.targets.sdist]
only-include = ["src", "frontend", "Gymbagfile", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "gymbag/frontend"

[tool.pytest.ini_options]
pythonpath = ["src"]
